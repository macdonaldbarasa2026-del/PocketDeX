name: Build PocketDeX APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew testStandardDebugUnitTest testEmbeddedWinlatorDebugUnitTest --no-daemon --stacktrace

      - name: Build APK variants
        run: ./gradlew assembleStandardDebug assembleEmbeddedWinlatorDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          standard="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          embedded="app/build/outputs/apk/embeddedWinlator/debug/app-embeddedWinlator-debug.apk"
          for apk in "$standard" "$embedded"; do
            test -f "$apk"
            ls -lh "$apk"
            unzip -Z1 "$apk" | grep -q "AndroidManifest.xml"
            unzip -Z1 "$apk" | grep -q "classes.dex"
          done
          unzip -Z1 "$embedded" | grep -q "lib/arm64-v8a/libwinlator.so"
          unzip -Z1 "$embedded" | grep -q "assets/rootfs.tzst"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: pocketdex-apk-variants
          path: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/embeddedWinlator/debug/app-embeddedWinlator-debug.apk
          retention-days: 30

      - name: Read app version
        id: app_version
        run: |
          version="$(awk -F'"' '/versionName =/ { print $2; exit }' app/build.gradle.kts)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish versioned APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.app_version.outputs.version }}"
          name: "PocketDeX v${{ steps.app_version.outputs.version }}"
          body: |
            PocketDeX v${{ steps.app_version.outputs.version }} desktop launcher APK.

            Built from commit ${{ github.sha }} by GitHub Actions. The APK is also
            available from the rolling `latest` release and this workflow's artifact.
          files: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/embeddedWinlator/debug/app-embeddedWinlator-debug.apk
          prerelease: false
          make_latest: false

      - name: Update rolling latest APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "PocketDeX - Desktop Mode Launcher (latest)"
          body: |
            Rolling APK from PocketDeX v${{ steps.app_version.outputs.version }}.

            Built from commit ${{ github.sha }} by GitHub Actions. For a stable
            versioned download, use the v${{ steps.app_version.outputs.version }} release.
          files: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/embeddedWinlator/debug/app-embeddedWinlator-debug.apk
          prerelease: false
          make_latest: true
